# Builds Tessera on Debian 13 with warnings treated as errors, runs the
# tests, and checks the Python and shell scripts. Runs on every push and
# pull request. A red run writes its reason onto the check itself, so the
# failure can be read without the Actions log (see tools/ci-annotate.py).
name: Checks

# Every commit runs, including one that only touches prose. The shortcut that
# used to skip `**.md` was wrong about one file: README.md is generated in part
# (its shortcut tables come from shell/tessera_shell/shortcuts.py), and the test
# that checks it is the one thing a prose-only commit can break. A minute of
# runner time is cheaper than a README that disagrees with the desktop.
on:
  push:
  pull_request:

# A push while the previous run of the same branch is still going makes the
# older one pointless: it is cancelled so the newest result comes sooner.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container: debian:trixie
    # A test that cannot finish should say so rather than hold a runner: the
    # desktop tests wait on a socket, and each wait has its own limit, so
    # anything still running after this is stuck for good.
    timeout-minutes: 15
    # bash with pipefail, because the steps below pipe their output into a
    # file: without it, a failing program would look like a passing step.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install what Tessera needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            build-essential meson ninja-build pkg-config libwlroots-0.18-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libinput-dev \
            libpixman-1-dev libcairo2-dev libpango1.0-dev libdrm-dev libsystemd-dev \
            libpam0g-dev libxcb1-dev libxcb-icccm4-dev libxcb-ewmh-dev \
            python3 python3-gi gir1.2-gtk-4.0 gir1.2-gtk4layershell-1.0 \
            gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 flake8 shellcheck

      # Pinned to a commit rather than to the moving `v4` tag: this action gets
      # to run on every pull request, and what it checks out is what then runs.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v7.0.1

      # The build goes to a log the reporter at the end reads, because a failed
      # compile says so in the Actions log only - and the log is on a host that a
      # restricted network cannot reach, which leaves a red tick and no reason.
      - name: Build the window manager (warnings are errors)
        run: |
          meson setup build compositor -Dwerror=true 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/build.log"
          ninja -C build 2>&1 | tee -a "${RUNNER_TEMP:-/tmp}/build.log"

      # The other checks in this job compare files with each other; this one
      # reads the desktop's C. It runs after the build, where wlroots' headers
      # are installed and the protocol headers this project generates exist, so
      # what it says is about this code rather than about context it could not
      # find. A finding is worth fixing or saying something about, so it fails
      # the job; `// cppcheck-suppress id` next to a line that knows better.
      - name: Static analysis of the desktop
        run: |
          apt-get install -y --no-install-recommends cppcheck
          cppcheck --version
          # --cflags-only-I rather than --cflags: cppcheck reads the same tree the
          # compiler does, but it is not a compiler, and a `-pthread` or
          # `-fno-strict-aliasing` handed over by pkg-config is an error to it.
          # Only `warning` is enabled to start with, and the run is the thing that
          # decides what the code is ready for: performance and portability are the
          # two to add once the findings that are already here are answered, not
          # before - a check that has to be muted on its first day is a check
          # nobody will ever unmute.
          #
          # Three things are muted, all of them the tool's model of wlroots rather
          # than anything in the code, and each named so that anyone can go and
          # look. `uninitvar` reads this codebase's
          # `calloc` + `wl_container_of` idiom - allocate a struct of a hundred
          # fields, initialise a dozen, and every later read of the rest is a
          # field the zeroing already set - and so it called every view, layer and
          # x11 child in the tree uninitialized; that is not a finding, and
          # suppressing one check is cheaper and truer than forty inline
          # suppressions on lines that are not wrong.
          # `normalCheckLevelMaxBranches` is cppcheck saying it gave up on a
          # function's branches at the default check level; the exhaustive level it
          # suggests costs a minute of CI for what it has found here so far.
          # `memleak` is the same story one level up: a hundred and three of these
          # files' allocations end in `wl_signal_add`, which hands the object to
          # the signal to free later, and cppcheck reads that as a leak in every
          # one of them - a finding repeated across input.c, view.c, layer.c,
          # xwayland.c and idle.c is the tool's model of wlroots, not the code.
          # Leaks in this project are checked where they can actually be seen: the
          # sanitiser job runs the C tests with `detect_leaks=1`.
          # The version has to be given or cppcheck cannot read `ipc.c`'s reply to
          # `tessera msg version` at all, since it is made by pasting a macro into a
          # string; meson passes it, and the value does not matter to the analysis.
          cppcheck --quiet --inline-suppr --std=c11 --language=c \
            --enable=warning --error-exitcode=1 \
            --suppress=uninitvar --suppress=normalCheckLevelMaxBranches \
            --suppress=memleak -DTESSERA_VERSION='"0.0.0"' \
            -DWLR_USE_UNSTABLE -Icompositor/src -Ibuild \
            $(pkg-config --cflags-only-I wlroots-0.18 pixman-1 libdrm wayland-server xkbcommon) \
            $(find compositor/src -name '*.c') 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/cppcheck.log"

      - name: Window manager tests
        run: |
          meson test -C build --print-errorlogs 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/meson.log"

      # Includes tests/test_compositor.py, which starts the window manager that
      # was just built on wlroots' headless backend and drives it over its
      # control socket; it skips itself if the build above did not happen.
      - name: Shell tests, and the desktop over its socket
        run: |
          python3 -m unittest discover -s tests -v 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/tests.log"

      - name: Python style
        run: flake8 shell tools tests 2>&1 | tee "${RUNNER_TEMP:-/tmp}/style.log"

      # flake8 has had no release since 2023, so the same Python is checked with a
      # maintained linter too - a name used before it is bound, a condition that
      # can only be true. From PyPI rather than apt, because the Debian package
      # lags by enough to disagree about which rules exist: the ones kept are in
      # ruff.toml at the top of the tree.
      - name: Python lint
        run: |
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --quiet --break-system-packages ruff
          ruff --version
          ruff check . 2>&1 | tee "${RUNNER_TEMP:-/tmp}/lint.log"

      - name: Shell scripts
        run: |
          shellcheck -s sh install.sh uninstall.sh data/tessera-autostart \
            data/tessera-session data/tessera-settings data/tessera-shell \
            data/tessera-update 2>&1 | tee "${RUNNER_TEMP:-/tmp}/shell.log"

      - name: Put the failure on the check run
        if: failure()
        run: python3 tools/ci-annotate.py "${RUNNER_TEMP:-/tmp}"/*.log

  # The same helper tests again with the sanitizers on: the buffer work in
  # ipc.c and switcher.c, the config file and the idle timer are where writing
  # past the end of something was ever possible, and none of it is visible to
  # a compiler. Debian splits the sanitizer runtimes into their own packages,
  # so that install is a step of its own which may fail: without them there is
  # nothing to check, and saying so out loud is worth more than a red tick.
  sanitizers:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install what Tessera needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            build-essential meson ninja-build pkg-config libwlroots-0.18-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libinput-dev \
            libpixman-1-dev libcairo2-dev libpango1.0-dev libdrm-dev libsystemd-dev \
            libpam0g-dev libxcb1-dev libxcb-icccm4-dev libxcb-ewmh-dev python3

      - name: Install the sanitizer runtimes (a build can do without them)
        continue-on-error: true
        run: |
          apt-get install -y --no-install-recommends libasan8 libubsan1

      # Pinned to a commit rather than to the moving `v4` tag: this action gets
      # to run on every pull request, and what it checks out is what then runs.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v7.0.1

      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          if ! echo 'int main(void) { return 0; }' |
              gcc -fsanitize=address,undefined -x c - -o "${RUNNER_TEMP:-/tmp}/sanitizer-check" 2>/dev/null; then
            echo "::warning::this image has no sanitizer runtime, so nothing was checked with them"
            exit 0
          fi
          # No -Dwerror=true here on purpose: this job is about memory, and a
          # warning the sanitizers provoke should not hide what they found. The
          # job above is the one that treats warnings as errors.
          meson setup build-sanitizer compositor -Db_sanitize=address,undefined
          ninja -C build-sanitizer 2>&1 | tee "${RUNNER_TEMP:-/tmp}/build.log"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            meson test -C build-sanitizer --print-errorlogs 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/meson.log"

      # The desktop itself, built with the sanitizers and driven over its
      # socket by tests/test_compositor.py: the buffer work in ipc.c, the lock
      # screen's helper process and the screen list are where writing past the
      # end of something was ever possible. Leak checking is off here on
      # purpose - a running desktop keeps allocations it means to keep until
      # the session ends, and LeakSanitizer wants a privilege containers need
      # not give.
      - name: The headless desktop, with the sanitizers on
        env:
          TESSERA: ${{ github.workspace }}/build-sanitizer/tessera
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          python3 -m unittest tests.test_compositor -v 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/tests.log"

      - name: Put the failure on the check run
        if: failure()
        run: python3 tools/ci-annotate.py "${RUNNER_TEMP:-/tmp}"/*.log
